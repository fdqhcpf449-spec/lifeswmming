<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swim for Life - Coach Prasanna</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background: radial-gradient(circle at top,#04121f,#000);
color:white;
overflow-x:hidden;
}

/* HEADER */
header{
text-align:center;
padding:30px 15px;
}

.profile{
width:140px;
height:140px;
border-radius:50%;
border:3px solid #00eaff;
box-shadow:0 0 25px #00eaff, 0 0 60px #00ffcc;
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-12px)}
100%{transform:translateY(0)}
}

h1{
margin:10px 0;
text-shadow:0 0 10px #00eaff;
}

/* LAYOUT */
.container{
max-width:900px;
margin:auto;
padding:15px;
}

/* CARDS */
.card{
background:rgba(255,255,255,0.06);
padding:20px;
border-radius:18px;
margin-bottom:15px;
backdrop-filter:blur(12px);
border:1px solid rgba(0,234,255,0.25);
box-shadow:0 0 20px rgba(0,234,255,0.15);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 0 30px #00eaff;
}

/* BUTTONS */
.btn{
display:block;
text-align:center;
padding:14px;
margin-top:10px;
border-radius:50px;
background:linear-gradient(90deg,#00eaff,#00ffcc,#00eaff);
background-size:200%;
color:black;
font-weight:700;
text-decoration:none;
transition:0.4s;
box-shadow:0 0 15px #00eaff;
}

.btn:hover{
transform:scale(1.05);
}

/* INPUT */
input,textarea{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
outline:none;
}

/* SPINNER */
.spinner{
width:40px;
height:40px;
border:4px solid rgba(255,255,255,0.2);
border-top:4px solid #00eaff;
border-radius:50%;
animation:spin 1s linear infinite;
display:none;
margin:10px auto;
}

@keyframes spin{
100%{transform:rotate(360deg)}
}

/* SUCCESS */
.success{
display:none;
text-align:center;
padding:20px;
color:#00ffcc;
}

.hidden{display:none;}

/* FLOAT WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:14px 16px;
border-radius:50px;
font-weight:bold;
box-shadow:0 0 15px #25D366;
text-decoration:none;
}
</style>
</head>

<body>

<header>
<img class="profile" src="https://lh3.google.com/u/0/d/1jJVbTJWfBdFkLeNqPDoYnqK1ZRJg3-x4=w2560-h1426-iv1">
<h1>SWIM FOR LIFE</h1>
<p>Coach Prasanna</p>
</header>

<div class="container" id="main">

<div class="card">
<h2>🏊 Elite Swimming Programme</h2>
<p>UK & American curriculum training with 24+ years experience in Dubai.</p>
</div>

<div class="card">
<h3>Contact</h3>
<a class="btn" href="https://wa.me/971555587125" target="_blank">💬 WhatsApp</a>
<a class="btn" href="mailto:swimwithpatrick@gmail.com">📧 Email</a>
</div>

<div class="card">
<h3>📅 Book Session</h3>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="email" placeholder="Email">
<input id="date" type="date">
<textarea id="message" placeholder="Message"></textarea>

<button class="btn" onclick="submitForm()">BOOK NOW</button>

<div class="spinner" id="spinner"></div>
</div>

</div>

<div class="success" id="success">
<h2>✔ Booking Successful</h2>
<p>We will contact you soon.</p>
<button class="btn" onclick="reset()">Go Home</button>
</div>

<a class="whatsapp" href="https://wa.me/971555587125" target="_blank">WhatsApp</a>

<script>

const scriptURL = "YOUR_GOOGLE_SCRIPT_URL_HERE";

function submitForm(){

document.getElementById("spinner").style.display="block";

fetch(scriptURL,{
method:"POST",
headers:{
"Content-Type":"text/plain;charset=utf-8"
},
body:JSON.stringify({
name:document.getElementById("name").value,
phone:document.getElementById("phone").value,
email:document.getElementById("email").value,
date:document.getElementById("date").value,
message:document.getElementById("message").value
})
})
.then(res=>res.json())
.then(data=>{
document.getElementById("spinner").style.display="none";
document.getElementById("main").classList.add("hidden");
document.getElementById("success").style.display="block";
})
.catch(()=>{
document.getElementById("spinner").style.display="none";
alert("Error sending booking");
});
}

function reset(){
document.getElementById("main").classList.remove("hidden");
document.getElementById("success").style.display="none";
}

</script>

</body>
</html>
